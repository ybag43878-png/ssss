<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 스마트 키오스크 ☕</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #f4f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .kiosk-container { background: #fff; width: 100%; max-width: 480px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 24px; border: 4px solid #222; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; color: #222; }
        .quick-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .tag-btn { background: #f0f2f5; border: 1px solid #ddd; padding: 10px 15px; border-radius: 20px; font-size: 13px; cursor: pointer; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 12px; margin-bottom: 15px; font-size: 15px; outline: none; }
        textarea { resize: none; height: 60px; font-family: sans-serif; }
        .order-btn { width: 100%; background: #ff5722; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .result-box { display: none; background: #fff8f6; border: 2px solid #ffccbc; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .error-msg { color: #d32f2f; font-weight: bold; }

        /* 새로 추가된 게시판 스타일 (기존 디자인 유지) */
        .board-section { border-top: 2px dashed #ddd; padding-top: 20px; margin-top: 10px; }
        .board-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #333; }
        .board-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .board-submit-btn { background: #333; color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; height: 45px; }
        .post-list { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .post-item { background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #eee; font-size: 13px; }
        .post-header { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 4px; }
        .post-content { color: #444; word-break: break-all; }
    </style>
</head>
<body>
    <div class="kiosk-container">
        <h1>☕ AI 맞춤 추천 키오스크</h1>
        
        <div class="quick-tags">
            <button class="tag-btn" onclick="setPrompt('피곤해서 졸려요, 강력한 카페인이 필요해요!')">⚡ 졸릴 때</button>
            <button class="tag-btn" onclick="setPrompt('달달하고 당 충전되는 음료 추천해줘!')">🍯 당 충전</button>
            <button class="tag-btn" onclick="setPrompt('비 오는 날 어울리는 따뜻한 음료')">🌧️ 감성 음료</button>
        </div>

        <input type="text" id="userInput" placeholder="원하는 메뉴 스타일이나 기분을 적어주세요!" />
        <button class="order-btn" id="submitBtn">AI 추천 메뉴 보기 ✨</button>
        
        <div class="result-box" id="resultBox"></div>

        <!-- 👇 새로 추가된 게시판 영역 -->
        <div class="board-section">
            <div class="board-title">📝 방문자 후기 게시판</div>
            <input type="text" id="boardAuthor" placeholder="닉네임" maxlength="10" style="margin-bottom: 8px;" />
            <div class="board-input-row">
                <textarea id="boardContent" placeholder="메뉴 추천 후기를 남겨주세요!"></textarea>
                <button class="board-submit-btn" onclick="addPost()">등록</button>
            </div>
            <div class="post-list" id="postList">
                <!-- 후기 목록이 여기에 표시됩니다 -->
            </div>
        </div>
    </div>

    <script>
        function setPrompt(text) { 
            document.getElementById('userInput').value = text; 
        }

        // 기존 AI 추천 기능
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const input = document.getElementById('userInput').value;
            const resultBox = document.getElementById('resultBox');

            if (!input.trim()) return alert('내용을 입력해주세요!');

            resultBox.style.display = 'block';
            resultBox.innerHTML = '🤖 AI 바리스타가 메뉴를 추천하고 있습니다...';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userInput: input })
                });

                const data = await response.json();

                if (response.ok) {
                    resultBox.innerHTML = data.result.replace(/\n/g, '<br>');
                } else {
                    resultBox.innerHTML = `<span class="error-msg">⚠️ 오류: ${data.error}</span><br><small style="color:gray;">상세: ${data.details}</small>`;
                }
            } catch (err) {
                resultBox.innerHTML = `<span class="error-msg">⚠️ 통신 실패.</span>`;
            }
        });

        // 👇 새로 추가된 게시판 스크립트 (localStorage 활용)
        function getPosts() {
            const posts = localStorage.getItem('kiosk_board');
            return posts ? JSON.parse(posts) : [];
        }

        function renderPosts() {
            const postList = document.getElementById('postList');
            const posts = getPosts();
            
            if (posts.length === 0) {
                postList.innerHTML = '<div style="text-align:center; color:#999; font-size:12px;">작성된 후기가 없습니다.</div>';
                return;
            }

            postList.innerHTML = posts.reverse().map(p => `
                <div class="post-item">
                    <div class="post-header">
                        <span><b>${p.author}</b></span>
                        <span>${p.date}</span>
                    </div>
                    <div class="post-content">${p.content}</div>
                </div>
            `).join('');
        }

        function addPost() {
            const author = document.getElementById('boardAuthor').value.trim();
            const content = document.getElementById('boardContent').value.trim();

            if (!author) return alert('닉네임을 입력해주세요!');
            if (!content) return alert('내용을 입력해주세요!');

            const newPost = {
                author,
                content,
                date: new Date().toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
            };

            const posts = getPosts();
            posts.push(newPost);
            localStorage.setItem('kiosk_board', JSON.stringify(posts));

            document.getElementById('boardAuthor').value = '';
            document.getElementById('boardContent').value = '';
            renderPosts();
        }

        window.onload = renderPosts;
    </script>
</body>
</html>
