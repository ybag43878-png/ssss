<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 스마트 키오스크 ☕</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f5f7; color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .kiosk-container { background: #ffffff; width: 100%; max-width: 480px; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; border: 4px solid #222; }
        .kiosk-header { background: #222; color: #fff; padding: 24px 20px; text-align: center; }
        .kiosk-header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .kiosk-header p { font-size: 13px; color: #aaa; margin-top: 6px; }
        .kiosk-body { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
        .section-title { font-size: 15px; font-weight: 700; color: #444; }
        .quick-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-btn { background: #f0f2f5; border: 1px solid #e1e4e8; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s; color: #333; }
        .tag-btn:hover { background: #e2e6ea; }
        input[type="text"] { width: 100%; padding: 16px; border: 2px solid #ddd; border-radius: 16px; font-size: 15px; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #ff5722; }
        .order-btn { background-color: #ff5722; color: #fff; border: none; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(255,87,34,0.3); }
        .order-btn:hover { background-color: #e64a19; }
        .loader { display: none; text-align: center; padding: 20px; font-size: 15px; font-weight: 600; color: #ff5722; }
        .result-card { display: none; background: #fff8f6; border: 2px solid #ffccbc; border-radius: 20px; padding: 20px; margin-top: 10px; }
        .result-card h2 { font-size: 18px; color: #d84315; margin-bottom: 10px; }
        .result-card p { font-size: 14px; line-height: 1.6; color: #444; }
    </style>
</head>
<body>
    <div class="kiosk-container">
        <div class="kiosk-header">
            <h1>☕ AI 맞춤 추천 키오스크</h1>
            <p>당신의 기분과 취향에 딱 맞는 메뉴를 AI가 추천해 드립니다.</p>
        </div>
        <div class="kiosk-body">
            <div class="section-title">💡 빠른 선택</div>
            <div class="quick-tags">
                <button class="tag-btn" onclick="setPrompt('피곤해서 졸려요, 강력한 카페인이 필요해요!')">⚡ 졸릴 때</button>
                <button class="tag-btn" onclick="setPrompt('달달하고 당 충전되는 음료 추천해줘!')">🍯 당 충전</button>
                <button class="tag-btn" onclick="setPrompt('상큼하고 칼로리 낮은 가벼운 음료')">🍋 상큼/깔끔</button>
                <button class="tag-btn" onclick="setPrompt('비 오는 날 어울리는 따뜻한 음료')">🌧️ 감성 음료</button>
            </div>
            <div class="section-title">✏️ 직접 입력하기</div>
            <input type="text" id="userInput" placeholder="예: 스트레스 받아서 칼칼한 거 먹고 입가심할 음료!" />
            <button class="order-btn" id="submitBtn">AI 추천 메뉴 보기 ✨</button>
            <div class="loader" id="loader">🤖 AI 바리스타가 최선의 메뉴를 조합 중입니다...</div>
            <div class="result-card" id="resultCard">
                <h2>🍹 AI 바리스타 추천결과</h2>
                <p id="menuContent"></p>
            </div>
        </div>
    </div>

    <script>
        function setPrompt(text) { 
            document.getElementById('userInput').value = text; 
        }

        function showError(message) {
            const resultCard = document.getElementById('resultCard');
            const menuContent = document.getElementById('menuContent');
            const loader = document.getElementById('loader');
            
            loader.style.display = 'none';
            menuContent.innerHTML = `<span style="color:#d32f2f; font-weight:bold;">⚠️ ${message}</span>`;
            resultCard.style.display = 'block';
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const input = document.getElementById('userInput').value;
            const resultCard = document.getElementById('resultCard');
            const loader = document.getElementById('loader');

            if (!input.trim()) {
                showError('원하시는 기분이나 취향을 입력해 주세요!');
                return;
            }

            if (window.location.protocol === 'file:') {
                showError('지금 다운받은 index.html 파일을 컴퓨터에서 직접 더블클릭해서 여셨군요! 😅<br><br>처음 기획하신 <b>[Vercel 서버리스 구조]</b>는 내 컴퓨터에서 바로 열면 서버가 없어서 오류가 납니다.<br><br>반드시 함께 다운로드된 <b>README.md</b> 파일을 보고 <b>Vercel에 배포(Deploy)</b>한 뒤, 발급된 인터넷 주소(URL)로 접속하셔야 정상 작동합니다!');
                return;
            }

            resultCard.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userInput: input })
                });

                // 서버 응답을 텍스트로 먼저 확인하여 예외 상황 방어
                const textData = await response.text();
                let data;
                
                try {
                    data = JSON.parse(textData);
                } catch (e) {
                    loader.style.display = 'none';
                    showError(`서버 응답 오류 (상태: ${response.status})<br>Vercel 환경 변수 세팅이나 Node 버전을 확인해 주세요.`);
                    return;
                }

                loader.style.display = 'none';

                if (response.ok && data.result) {
                    // AI의 답변 텍스트에서 줄바꿈을 HTML 태그로 변환하여 예쁘게 출력
                    const formattedText = data.result.replace(/\n/g, '<br>');
                    document.getElementById('menuContent').innerHTML = formattedText;
                    resultCard.style.display = 'block';
                } else {
                    showError('서버 오류 발생: ' + (data.error || 'API 연동에 실패했습니다.'));
                }
            } catch (err) {
                showError('서버 통신 오류가 발생했습니다.<br>로컬 개발 환경(vercel dev)이 켜져 있는지 확인해 주세요.');
            }
        });
    </script>
</body>
</html>
