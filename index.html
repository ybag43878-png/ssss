<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 스마트 키오스크 ☕</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #f4f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .kiosk-container { background: #fff; width: 100%; max-width: 480px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 24px; border: 4px solid #222; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; color: #222; }
        .quick-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .tag-btn { background: #f0f2f5; border: 1px solid #ddd; padding: 10px 15px; border-radius: 20px; font-size: 13px; cursor: pointer; }
        input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 12px; margin-bottom: 15px; font-size: 15px; outline: none; }
        .order-btn { width: 100%; background: #ff5722; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .result-box { display: none; background: #fff8f6; border: 2px solid #ffccbc; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .error-msg { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="kiosk-container">
        <h1>☕ AI 맞춤 추천 키오스크</h1>
        
        <div class="quick-tags">
            <button class="tag-btn" onclick="setPrompt('피곤해서 졸려요, 강력한 카페인이 필요해요!')">⚡ 졸릴 때</button>
            <button class="tag-btn" onclick="setPrompt('달달하고 당 충전되는 음료 추천해줘!')">🍯 당 충전</button>
            <button class="tag-btn" onclick="setPrompt('비 오는 날 어울리는 따뜻한 음료')">🌧️ 감성 음료</button>
        </div>

        <input type="text" id="userInput" placeholder="원하는 메뉴 스타일이나 기분을 적어주세요!" />
        <button class="order-btn" id="submitBtn">AI 추천 메뉴 보기 ✨</button>
        
        <div class="result-box" id="resultBox"></div>
    </div>

    <script>
        function setPrompt(text) { 
            document.getElementById('userInput').value = text; 
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const input = document.getElementById('userInput').value;
            const resultBox = document.getElementById('resultBox');

            if (!input.trim()) return alert('내용을 입력해주세요!');

            resultBox.style.display = 'block';
            resultBox.innerHTML = '🤖 AI 바리스타가 메뉴를 추천하고 있습니다...';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userInput: input })
                });

                const data = await response.json();

                if (response.ok) {
                    resultBox.innerHTML = data.result.replace(/\n/g, '<br>');
                } else {
                    resultBox.innerHTML = `<span class="error-msg">⚠️ 오류: ${data.error}</span><br><small style="color:gray;">상세: ${data.details}</small>`;
                }
            } catch (err) {
                resultBox.innerHTML = `<span class="error-msg">⚠️ 통신 실패.</span>`;
            }
        });
    </script>
</body>
</html>
